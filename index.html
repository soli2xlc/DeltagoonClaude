<style>

<script>
const C=document.getElementById('c'),g=C.getContext('2d'),W=640,H=480,K={},P={};
const KM={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',z:'z',Enter:'z',' ':'z',x:'x',Shift:'x'};
let AC;function dn(k){if(!K[k])P[k]=1;K[k]=1;try{AC=AC||new AudioContext()}catch(e){}}
function up(k){K[k]=0}
addEventListener('keydown',e=>{const k=KM[e.key];if(k){dn(k);e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)up(k)});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();dn(k)});['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>up(k)))});
C.addEventListener('pointerdown',()=>{if(S=='title'||S=='end'){dn('z');setTimeout(()=>up('z'),60)}});
function blip(f,d=.05,t='square'){if(!AC)return;try{const o=AC.createOscillator(),v=AC.createGain();o.type=t;o.frequency.value=f;v.gain.value=.03;o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const FA={Kris:'#5b8cff',Susie:'#d27ae6',Ralsei:'#4fd08a',Pilz:'#ff7b7b',Nimbus:'#9fb4ff',Kerzchen:'#ffb347','*':'#fff'};
const party=[{n:'Kris',hp:90,mx:90,c:'#5b8cff',h:'#2a1c12',s:'#f0c9a0',a:['Check','Zuwinken'],b:18},{n:'Susie',hp:110,mx:110,c:'#8a3fc0',h:'#d27ae6',s:'#9fb0e0',sc:1.25,a:['Check','Anbrüllen'],b:28},{n:'Ralsei',hp:70,mx:70,c:'#2e9e5b',h:'#2e9e5b',s:'#f6f1ea',hat:1,a:['Check','Beruhigen'],b:8}];
const E=[
{n:'Kerzchen',mx:60,dmg:8,p:0,intro:'Ein Kerzchen flackert einsam vor euch.',chk:'KERZCHEN – ANG 6 VER 2. Flackert aus Einsamkeit. Mag Gesellschaft.',act:{Beruhigen:[60,'Ralsei summt ein Lied. Die Flamme wird ruhig.'],Anbrüllen:[20,'Susie brüllt! Das Kerzchen zittert.'],Zuwinken:[20,'Kris winkt. Das Kerzchen winkt schüchtern zurück.']},idle:['Wachs tropft auf den Boden.','Das Kerzchen flackert nervös.']},
{n:'Baron Nimbus',mx:240,dmg:12,p:1,intro:'Baron Nimbus plustert sich auf!',chk:'BARON NIMBUS – ANG 12 VER 5. Wolke mit Zylinder. Will nur beachtet werden.',act:{Beruhigen:[35,'Ralsei lobt den Zylinder. Nimbus wird rosa.'],Anbrüllen:[10,'Susie brüllt. Nimbus donnert zurück!'],Zuwinken:[25,'Kris klatscht Beifall. Nimbus strahlt kurz.']},idle:['Es nieselt leicht.','Nimbus zwirbelt seinen Wolkenbart.']},
{n:'Sporling',mx:70,dmg:9,p:0,intro:'Ein Sporling schwebt heran und niest.',chk:'SPORLING – ANG 8 VER 3. Verteilt Sporen. Fühlt sich unbeachtet.',act:{Beruhigen:[50,'Ralsei reicht ein Taschentuch. Der Sporling beruhigt sich.'],Anbrüllen:[20,'Susie brüllt. Spore, Spore, Spore!'],Zuwinken:[30,'Kris winkt. Der Sporling hüpft vor Freude.']},idle:['Der Sporling niest Funken.','Ein Pilzhut wippt hin und her.']},
{n:'Spiegelchen',mx:110,dmg:10,p:1,intro:'Ein Spiegelchen zeigt euch euer eigenes Gesicht.',chk:'SPIEGELCHEN – ANG 10 VER 6. Zeigt, was man verdrängt. Will gesehen werden.',act:{Beruhigen:[40,'Ralsei lächelt in den Spiegel. Das Spiegelchen schmilzt.'],Anbrüllen:[10,'Susie brüllt ihr Spiegelbild an. Es brüllt zurück.'],Zuwinken:[35,'Kris winkt. Das Spiegelbild winkt ehrlich zurück.']},idle:['Euer Spiegelbild blinzelt.','Splitter klirren leise.']}];
const R=[
{n:'Fliederwiese',bg:'#0d0722',fl:'#150b33',tr:'#2a1260',hi:'#4a2aa0',w:[[0,0,640,150],[0,420,640,60],[250,250,50,50]],to:1,npc:[{x:150,y:230,t:'star'},{x:480,y:240,t:'pilz',l:['Pilz|Psst! Die Lichtkrone ist weg und es wird jeden Tag dunkler.','Pilz|Im Kartenwald spukt ein Kerzchen. Ich glaube, es ist nur einsam.']}]},
{n:'Kartenwald',bg:'#07142a',fl:'#0c2040',tr:'#0f3a52',hi:'#1e6a80',w:[[0,0,640,150],[0,420,640,60],[190,330,60,50],[340,180,50,50]],to:2,in:['Ralsei|Der Kartenwald! Früher wuchsen hier Spielkarten an den Bäumen. Jetzt hängen nur Schatten dran.','Susie|Gruselig. Ich mag es.'],npc:[{x:110,y:230,t:'star'}],
en:{x:440,y:300,f:'k',k:0,pre:['Kerzchen|Fffl… bleibt nicht lange! Ich flackere gern allein!','Susie|Als ob. Ich puste dich gleich aus!'],sp:['Kerzchen|Du warst… nett. Danke. Folgt dem Nebel zur Brücke.','Ralsei|Seht ihr? Freundlichkeit wirkt! Toll, Kris!','Susie|Hmpf. War… okay. Weiter.'],ki:['*|Das Kerzchen ist erloschen.','Ralsei|Oh… na ja. Gehen wir weiter.','Susie|Hey, der hat angefangen!']}},
{n:'Nebelbrücke',bg:'#0a1f24',fl:'#0f2d33',tr:'#16424a',hi:'#2a7a80',w:[[0,0,640,150],[0,420,640,60],[300,300,60,50]],to:3,in:['Ralsei|Hier beginnt der Nebel. Er kommt von Baron Nimbus – er war früher unser Wetterwart.','Susie|Wetterwart? Der Typ hat Regen gemacht?','Ralsei|Jeden Morgen hat er den Tau verteilt. Aber als die Lichtkrone geschmiedet wurde, dachte niemand mehr an ihn.','Susie|…Und deshalb klaut er sie. Na super.'],npc:[{x:110,y:230,t:'star'},{x:260,y:200,t:'pilz',l:['Pilz|Der Sporling vorn will nur Gesellschaft.','Pilz|Redet erst, kämpft danach. Oder gar nicht.']}],
en:{x:450,y:290,f:'s',k:2,pre:['Sporling|Hatschi! Ich verbreite nur Sporen, versprochen!','Susie|Ugh. Nies woanders.'],sp:['Sporling|Danke. Der Baron versteckt die Krone im Spiegelgarten. Er hat Angst vor seinem Spiegelbild.','Ralsei|Interessant…'],ki:['*|Der Sporling zerplatzt in Funken.','Susie|…Wir hätten fragen sollen, oder?']}},
{n:'Spiegelgarten',bg:'#1a1030',fl:'#2a1a4a',tr:'#5a3a8a',hi:'#a080e0',w:[[0,0,640,150],[0,420,640,60],[220,200,50,50],[380,340,50,50]],to:4,in:['Ralsei|Der Spiegelgarten! Hier zeigt jede Blume, was man tief drinnen fühlt.','Susie|Ich sehe nur mich. Schon wieder.','Ralsei|Susie? Alles okay?','Susie|Hmpf. Ja. Ich war nur… oft allein. Weiter jetzt.','Kris|…','*|Kris legt Susie kurz die Hand auf die Schulter.'],npc:[{x:110,y:230,t:'star'}],
en:{x:450,y:290,f:'m',k:3,pre:['Spiegelchen|Ich zeige, was ihr wirklich fühlt! Wer will zuerst?','Susie|Ich garantiert nicht.'],sp:['Spiegelchen|Du hast mich nicht zerbrochen. Das schaffen nur wenige.','Susie|…Danke. Glaub ich.','Ralsei|Der Baron wartet hinter dem Tor. Er hat Angst, vergessen zu werden. Lasst uns mit ihm reden.'],ki:['*|Das Spiegelchen zerspringt in tausend Splitter.','Susie|Sieben Jahre Pech, was?','Ralsei|…Gehen wir. Der Thronsaal ist nah.']}},
{n:'Thronsaal',bg:'#1c0a2e',fl:'#2a1245',tr:'#4a1a5a',hi:'#8a3a9a',w:[[0,0,640,150],[0,420,640,60]],in:['*|Der Saal ist kalt und still. Auf dem Thron hockt eine kleine Gewitterwolke.'],npc:[{x:110,y:230,t:'star'}],
en:{x:490,y:285,f:'b',k:1,pre:['Nimbus|Hohoho! Wer wagt es, in MEINEN Thronsaal zu schweben?','Nimbus|Die Lichtkrone gehört jetzt mir! Wolken wollen auch mal glänzen!','Ralsei|Baron Nimbus, bitte! Ohne die Krone friert unser Reich ein.','Susie|Gib sie her, Wattebausch!','Nimbus|Ihr seid bis hierher gekommen?! DANN ZEIGE ICH EUCH EIN GEWITTER!'],
sp:['Nimbus|Ich… wollte nur, dass mich jemand beachtet. Hier – die Krone.','Ralsei|Baron, ich hätte dich nicht vergessen dürfen. Willst du wieder Wetterwart werden?','Nimbus|Ich? Ehrlich? …Dann lasse ich es heute Nacht für euch schneien. Funkelnder Schnee!','*|Die Lichtkrone leuchtet auf. Der ganze Saal wird warm.','Ralsei|Ihr habt das Fliederreich gerettet – ohne Gemeinheit!','Susie|Und ein paar Wolken hab ich trotzdem gerupft. Gutes Team.','*|Kris lächelt. Draußen beginnt es zu schneien.'],
ki:['*|Nimbus zerfällt zu Nebel. Die Krone fällt zu Boden.','Ralsei|Wir haben sie zurück. Aber vielleicht hätten wir reden können.','Susie|…Ja. Vielleicht.'],end:()=>S='end'}}];
let tp=0,S='title',fr=0,room=0,pl={x:60,y:300,d:'d'},trail=[],flags={},items=3,dlg=null,B=null,fade=0,rt=0;
const INTRO=['*|Ein ruhiger Nachmittag. Kris steht im Wohnzimmer, draußen färbt sich das Laub orange.','*|Pfeiltasten: laufen. Z: reden. X: zurück. Geh nach rechts, wenn du bereit bist.'];
function say(l,cb){dlg={l,i:0,n:0,cb};S='talk'}
function talk(){const[w,t]=dlg.l[dlg.i].split('|');if(dlg.n<t.length){dlg.n+=.7;if(fr%3==0)blip({Susie:190,Ralsei:420,Kris:300,Nimbus:150}[w]||260)}
if(P.z){if(dlg.n<t.length)dlg.n=t.length;else if(++dlg.i>=dlg.l.length){S='play';dlg.cb&&dlg.cb()}else dlg.n=0}}
function hit(x,y){if(x<12)return 1;if(!R[room].fz.some(([a,b,w,h])=>x>=a&&x<=a+w&&y>=b&&y<=b+h))return 1;return R[room].w.some(([a,b,w,h])=>x+8>a&&x-8<a+w&&y>b&&y-8<b+h)}
function go(t){room=t;pl.x=40;pl.y=300;trail=[];fade=1;rt=140;const i=R[t].in;if(i&&!flags['i'+t]){flags['i'+t]=1;say(i)}}
function walk(){const r=R[room];let dx=(K.r?1:0)-(K.l?1:0),dy=(K.d?1:0)-(K.u?1:0);
if(dx||dy){pl.mv=1;pl.t=(pl.t||0)+1;pl.d=dx?(dx>0?'r':'l'):(dy>0?'d':'u');if(!hit(pl.x+dx*3,pl.y))pl.x+=dx*3;if(!hit(pl.x,pl.y+dy*3))pl.y+=dy*3;trail.push({x:pl.x,y:pl.y});if(trail.length>50)trail.shift()}else pl.mv=0;
if(pl.x>624&&r.to!=null)return go(r.to);
if(P.z)for(const n of r.npc){if(Math.hypot(n.x-pl.x,n.y-pl.y)<60){if(n.t=='star')say(['*|Ein warmer Stern. Die Gruppe ruht kurz aus. HP voll!'],()=>party.forEach(p=>p.hp=p.mx));else say(n.l,n.cb);break}}
const v=r.ev;if(v&&!flags[v.f]&&pl.x>v.x){flags[v.f]=1;say(v.l,v.cb)}
const e=r.en;if(e&&!flags[e.f]&&Math.hypot(e.x-pl.x,e.y-pl.y)<55)say(e.pre,()=>battle(e.k,sp=>{flags[e.f]=1;say(sp?e.sp:e.ki,e.end)}))}
function battle(k,after){const d=E[k];S='battle';B={ei:k,e:{...d,hp:d.mx,mercy:0,k},i:0,df:{},sel:0,sub:0,bx:0,after,shk:0};bm('* '+d.intro,nextTurn)}
function bm(msg,next){B.st='msg';B.msg=msg;B.n=0;B.next=next}
function nextTurn(){while(B.i<3&&party[B.i].hp<=0)B.i++;if(B.i>=3)return dodge();B.st='menu';B.sel=0}
function adv(){B.i++;nextTurn()}
function win(sp){const b=B,e=b.e;bm(sp?'* '+e.n+' wurde verschont. Ein gutes Gefühl.':'* '+e.n+' wurde besiegt.',()=>{S='play';B=null;b.after(sp)})}
function dodge(){const b=B;b.st='dodge';b.dt=420;b.hx=320;b.hy=300;b.bl=[];b.inv=0;b.df=b.df||{};const al=[0,1,2].filter(i=>party[i].hp>0);b.tg=al[Math.random()*al.length|0]}
function hurt(){const b=B,p=party[b.tg];p.hp=Math.max(0,p.hp-Math.round(b.e.dmg*(b.df[b.tg]?.5:1)));b.inv=40;blip(110,.15,'sawtooth');if(p.hp<=0){const al=[0,1,2].filter(i=>party[i].hp>0);if(!al.length){const ei=b.ei,af=b.after;bm('* Alle sind erschöpft… Ein Stern schenkt euch neue Kraft!',()=>{party.forEach(q=>q.hp=q.mx);battle(ei,af)})}else b.tg=al[0]}}
function bat(){const b=B,e=b.e,m=party[b.i];if(b.shk>0)b.shk--;
if(b.st=='msg'){if(b.n<b.msg.length)b.n+=1.3;if(P.z){if(b.n<b.msg.length)b.n=b.msg.length;else b.next()}}
else if(b.st=='menu'){if(P.l||P.u)b.sel=(b.sel+4)%5;if(P.r||P.d)b.sel=(b.sel+1)%5;if(P.z){blip(520);const s=b.sel;if(s==0){b.st='fight';b.bx=0}else if(s==1){b.st='act';b.sub=0}else if(s==2){if(!items)bm('* Keine Items mehr!',()=>b.st='menu');else{let t=party[0];party.forEach(p=>{if(p.hp/p.mx<t.hp/t.mx)t=p});t.hp=Math.min(t.mx,t.hp+45);items--;bm('* '+m.n+' gibt '+t.n+' Dunkelkuchen. +45 HP! (Übrig: '+items+')',adv)}}
else if(s==3){if(e.mercy>=100)win(1);else bm('* '+e.n+' ist noch nicht bereit, verschont zu werden.',()=>b.st='menu')}else{b.df[b.i]=1;bm('* '+m.n+' schützt sich.',adv)}}}
else if(b.st=='act'){if(P.u||P.d)b.sub=1-b.sub;if(P.x)b.st='menu';if(P.z){const a=m.a[b.sub];if(a=='Check')bm('* '+e.chk,adv);else{const[v,t]=e.act[a];e.mercy=Math.min(100,e.mercy+v);tp=Math.min(100,tp+12);bm('* '+t+' (Gnade '+e.mercy+'%)',adv)}}}
else if(b.st=='fight'){b.bx+=.02;if(P.z){const acc=1-Math.abs(b.bx-.5)*2,d=Math.round(m.b*(.3+acc*1.2));e.hp-=d;b.shk=20;blip(180,.12,'sawtooth');if(e.hp<=0)win(0);else bm('* '+m.n+' trifft für '+d+' Schaden!',adv)}else if(b.bx>1)bm('* '+m.n+' verfehlt!',adv)}
else if(b.st=='dodge'){b.hx=Math.max(210,Math.min(430,b.hx+((K.r?1:0)-(K.l?1:0))*3.2));b.hy=Math.max(225,Math.min(360,b.hy+((K.d?1:0)-(K.u?1:0))*3.2));b.dt--;const t=420-b.dt,k=e.p;
if(t%(k?16:12)==0)b.bl.push({x:210+Math.random()*220,y:215,vx:0,vy:2.6+k,r:6});
if(k&&t%55==0){const l=Math.random()<.5;b.bl.push({x:l?200:440,y:230+Math.random()*130,vx:l?3.4:-3.4,vy:0,r:7})}
if(k&&t%100==50)for(let a=0;a<8;a++)b.bl.push({x:320,y:215,vx:Math.cos(a*.785)*2.4,vy:Math.sin(a*.785)*2.4+.7,r:6});
b.inv--;b.bl.forEach(q=>{q.x+=q.vx;q.y+=q.vy;const dq=Math.hypot(q.x-b.hx,q.y-b.hy);if(b.inv<=0&&dq<q.r+5){q.x=-999;hurt()}else if(dq<q.r+22)tp=Math.min(100,tp+.1)});
b.bl=b.bl.filter(q=>q.y<372&&q.y>205&&q.x>195&&q.x<445);
if(b.dt<=0&&b.st=='dodge'){b.df={};b.i=0;bm('* '+e.idle[Math.random()*2|0],nextTurn)}}}
function restart(){tp=0;party.forEach(p=>p.hp=p.mx);flags={};items=3;room=0;pl={x:60,y:300,d:'d'};trail=[];S='title'}
function update(){fr++;if(fade>0)fade-=.04;if(rt>0)rt--;
if(S=='title'){if(P.z){room=9;rt=140;say(INTRO,()=>{})}}else if(S=='talk')talk();else if(S=='play')walk();else if(S=='battle')bat();else if(S=='seal')sealU();else if(S=='end'&&P.z)restart();
for(const k in P)delete P[k]}
